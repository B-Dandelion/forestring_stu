name: forestring_stu
description: "Forestring App for students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  connectivity_plus: any
  table_calendar: ^3.1.2
  intl: any
  provider: ^6.0.5
  supabase_flutter: ^2.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  firebase_core: ^3.3.0
  firebase_analytics: ^11.2.1
  cloud_firestore: ^5.3.0
  shared_preferences: ^2.2.1
  connectivity_plus: ^6.0.5
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
  fonts:
    - family: ELAND
      fonts:
        - asset: assets\fonts\ELAND_초이스OTF-B.otf
          weight: 700
        - asset: assets\fonts\ELAND_초이스OTF-L.otf
          weight: 300
        - asset: assets\fonts\ELAND_초이스OTF-M.otf
          weight: 500
    - family: OpenSans
      fonts:
        - asset: assets\fonts\OpenSans-Bold.ttf
          weight: 700
        - asset: assets\fonts\OpenSans-Light.ttf
          weight: 300
        - asset: assets\fonts\OpenSans-Medium.ttf
          weight: 500
